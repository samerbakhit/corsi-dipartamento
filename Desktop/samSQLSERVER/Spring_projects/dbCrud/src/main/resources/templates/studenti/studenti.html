<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista Studenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body>
   <span class="btn btn-outline-success">Lista Studenti</span>
   <a th:href="@{/studenti}" class="btn btn-outline-success">Back</a>
   <a th:href="@{/studenti/newStudente}" class="btn btn-outline-success"><i class="bi bi-person-plus"></i></a>
  <table class="table table-striped table-bordered">

  <thead>
	<tr><th>Matricola</th>
	<th>Nome</th>
	<th>Cognome</th>
	<th>Anni</th>
	
	
	</tr>
  </thead>
  <tbody>
  <tr th:each="studenti : ${listaStudenti}">
  <td th:text="${studenti.id}">
  <td th:text="${studenti.nome}">
  <td th:text="${studenti.cognome}">
  <td th:text="${studenti.anni}">
 
  <td>
  <a th:href="@{/studenti/edit/{id}(id=${studenti.id})}" class="btn btn-warning"><i class="bi bi-pencil-fill"></i></a>
  <a th:href="@{/studenti/delete/{id}(id=${studenti.id})}" class="btn btn-danger"
   th:data-confirm-delete="'Sei sicuro di cancellare questo Studente : '+ ${studenti.id}+' '+${studenti.nome}+' '+${studenti.cognome}"
   onclick="return confirm(this.getAttribute('data-confirm-delete'))"><i class="bi bi-trash3-fill"></i></a>
                    </td>
  </tr>
  </tbody>
</table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
